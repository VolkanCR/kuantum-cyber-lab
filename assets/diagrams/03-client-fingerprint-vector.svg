<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 160" width="100%" height="160" fill="none">
    <style>
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #111111; }
        .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10px; fill: #71717a; }
        .stroke-line { stroke: #111111; stroke-width: 1.2; }
        .subtle-box { stroke: #e4e4e7; stroke-width: 1; fill: #fafafa; }
        .highlight-box { stroke: #111111; stroke-width: 1.2; fill: #111111; }
    </style>

    <!-- HTTP Paket Başlıkları (Sol Blok) -->
    <rect x="20" y="20" width="220" height="120" class="subtle-box" />
    <text x="35" y="42" class="mono" font-weight="600">INBOUND HTTP PACKET</text>
    <line x1="35" y1="50" x2="225" y2="50" stroke="#e4e4e7" stroke-width="1" />
    
    <text x="35" y="68" class="mono" font-size="10px">GET /api/v1/stream HTTP/1.1</text>
    <text x="35" y="85" class="mono" font-size="10px">Host: live.kuantum-pi.net</text>
    
    <!-- User-Agent Seçim Vurgusu -->
    <rect x="30" y="94" width="200" height="22" stroke="#111111" stroke-width="1" fill="#ffffff" />
    <text x="35" y="109" class="mono" font-weight="600" font-size="10px">> User-Agent: [Client]</text>
    
    <text x="35" y="130" class="mono" font-size="9px" fill="#71717a">Accept-Encoding: gzip, br</text>

    <!-- Ayrıştırma Oku -->
    <line x1="240" y1="105" x2="318" y2="105" class="stroke-line" />
    <polygon points="320,105 312,101 312,109" fill="#111111" />

    <!-- Başlık Analizörü ve Karşılaştırma Matrisi (Sağ Blok) -->
    <rect x="320" y="25" width="240" height="110" stroke="#111111" stroke-width="1.2" fill="#ffffff" />
    <text x="440" y="48" text-anchor="middle" class="mono" font-weight="600">HEURISTIC EVALUATOR</text>
    <line x1="335" y1="58" x2="545" y2="58" stroke="#e4e4e7" stroke-width="1" />
    
    <text x="340" y="78" class="mono" font-size="10px">python-requests/*  --> BOT</text>
    <text x="340" y="96" class="mono" font-size="10px">curl/7.88.1        --> BOT</text>
    <text x="340" y="114" class="mono" font-size="10px">Mozilla/5.0 ...    --> STANDARD</text>

    <!-- Yan Teşhis Çemberi -->
    <circle cx="530" cy="85" r="10" stroke="#111111" stroke-width="1.2" />
    <line x1="525" y1="85" x2="535" y2="85" stroke="#111111" stroke-width="1.2" />
    <line x1="530" y1="80" x2="530" y2="90" stroke="#111111" stroke-width="1.2" />
</svg>
